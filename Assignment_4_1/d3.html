    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Weather Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family:Arial, sans-serif;
            background: #f4f6f8;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: lightskyblue;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Interactive Weather Dashboard</h1>

    <div class="controls">
        <label for="city"> Select City: </label>
        <select id="city" onchange="updateData()">
            <option value="Pune">Pune</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Delhi">Delhi</option>
        </select>
    </div>

    <div class="dashboard"> 
        <div class="card">
            <h3> Temperature (°C) </h3>
            <canvas id="tempChart"></canvas>
        </div>

        <div class="card">
            <h3> Humidity (%) </h3>
            <canvas id="humidityChart"></canvas>
        </div>

        <div class="card">
            <h3> Rainfall (mm) </h3>
            <canvas id="rainChart"></canvas>
        </div>
    </div>
    <div id="chart"></div>
    <script>
        // D3.js code will go here
        const weatherData = {
            Pune: {
                temp: [24, 26, 28, 27, 25, 24, 23],
                humidity: [60, 58, 55, 57, 59, 62, 65],
                rainfall: [0, 2, 5, 1, 0, 0, 0]
            },
            Mumbai: {
                temp: [30, 32, 31, 29, 28, 27, 26],
                humidity: [70, 68, 65, 67, 69, 72, 75],
                rainfall: [5, 10, 15, 8, 3, 2, 1]
            },
            Delhi: {
                temp: [12, 18, 25, 32, 38, 42, 35],
                humidity: [55, 48, 42, 35, 28, 25, 65],
                rainfall: [2, 3, 1, 0, 2, 8, 180]
            }
        };

        const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];
        const tempChart = new Chart(document.getElementById('tempChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Temperature',
                    data: weatherData.Pune.temp,
                    borderWidth: 2
                }]
            }
        });

        const humidityChart = new Chart(document.getElementById('humidityChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Humidity',
                    data: weatherData.Pune.humidity,
                }]
            }
        });

        const rainChart = new Chart(document.getElementById('rainChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Rainfall',
                    data: weatherData.Pune.rainfall,
                }]
            }
        });

        function updateData() {
            const city = document.getElementById('city').value;
            tempChart.data.datasets[0].data = weatherData[city].temp;
            humidityChart.data.datasets[0].data = weatherData[city].humidity;
            rainChart.data.datasets[0].data = weatherData[city].rainfall;
            
            tempChart.update();
            humidityChart.update();
            rainChart.update();
        }
    </script>
</body>
</html>
